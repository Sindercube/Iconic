plugins {
	id 'fabric-loom' version '1.8-SNAPSHOT'
	id 'dev.kikugie.j52j' version '1.0.2'
	id 'maven-publish'
}

base.archivesName = mod_id
version = mod_version

subprojects {
	base.archivesName = project.name
	version = module_version
}

allprojects {
	apply plugin: 'java'
	apply plugin: 'fabric-loom'
	apply plugin: 'dev.kikugie.j52j'

	group = mod_group

	java {
		withSourcesJar()
	}

	sourceSets {
		testmod {
			compileClasspath += main.compileClasspath
			runtimeClasspath += main.runtimeClasspath
		}
	}

	loom {
		runs {
			client {
				name = "Test Client"
				source sourceSets.testmod
			}
			server {
				name = "Test Server"
				source sourceSets.testmod
			}
		}
	}

	dependencies {
		minecraft "com.mojang:minecraft:$minecraft_version"
		mappings "net.fabricmc:yarn:$yarn_mappings:v2"
		modImplementation "net.fabricmc:fabric-loader:$loader_version"
		modImplementation "net.fabricmc.fabric-api:fabric-api:$fabric_version"
	}

	processResources {
		filesMatching("fabric.mod.json") {
			expand project.properties
		}
	}
}

subprojects {
	apply plugin: 'maven-publish'

	dependencies {
		if (project.name != "iconic-base") api project(path: ":iconic-base", configuration: 'namedElements')
	}

	publishing {
		publications {
			mavenJava(MavenPublication) {
				from components.java
			}
		}
	}
	tasks.build.finalizedBy publishToMavenLocal
}

dependencies {
	subprojects.each {
		include project(path: "${it.path}", configuration: "namedElements")
	}
}
